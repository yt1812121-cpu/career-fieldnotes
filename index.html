let state={entries:[],methods:[]},view='timeline';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function dateFmt(a,b){const f=x=>x?new Date(x+'T00:00:00').toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}):'';return f(a)+(b&&b!==a?' — '+f(b):'')}function timelineDate(a,b){const p=x=>{const [y,m,d]=(x||'').slice(0,10).split('-');return {y,m,d}};const s=p(a),e=p(b||a);if(!s.m||!s.d)return {start:'',end:''};const f=x=>`${x.m}/${x.d}`;return {start:f(s),end:b&&b!==a?f(e):''}}
const STORE_KEY='careerFieldnotes.v1';

$('#timeline').innerHTML=es.length?es.map(e=>`<article class="entry${e.end_date&&e.end_date!==e.start_date?' multi-date':''}" data-date-start="${esc(timelineDate(e.start_date,e.end_date).start)}" data-date-end="${esc(timelineDate(e.start_date,e.end_date).end)}" title="${esc(dateFmt(e.start_date,e.end_date))}"><div class="entry-top"><div><div class="chips"><span class="chip source-chip">${esc(sourceLabel(e))}</span>${tagLink(e.category)}<span class="chip status ${statusClass(e.status)}">${esc(e.status||"未标记")}</span></div><h3>${esc(e.title)}</h3>${e.project?`<div class="project-line">${esc(e.project)}${e.milestone?` / ${esc(e.milestone)}`:""}</div>`:""}</div><div class="actions"><button class="btn secondary small" onclick="editEntry(${e.id})">编辑</button><button class="btn secondary small" onclick="previewCopy('Entry',${e.id})">复制</button><button class="btn secondary small" onclick="removeEntry(${e.id})">删除</button></div></div>${e.summary?`<p>${esc(e.summary)}</p>`:''}<div class="detail-grid">${e.learning?`<div class="detail"><b>观察与收获</b>${esc(e.learning)}</div>`:''}${e.output?`<div class="detail"><b>产出</b>${esc(e.output)}</div>`:''}${e.follow_up?`<div class="detail"><b>待跟进</b>${esc(e.follow_up)}</div>`:''}</div></article>`).join(''):`<div class="empty">${q?'没有找到相关经历。':'还没有经历，点击「新增经历」记下第一段。'}</div>`;

const localDay=(d)=>(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));

function renderCalendar(){
 const y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();
 $('#monthTitle').textContent=`${y} 年 ${m+1} 月`;const grid=$('#monthGrid');grid.replaceChildren();
 const head=document.createElement('div');head.className='week-head';for(const x of '一二三四五六日'){const n=document.createElement('small');n.textContent=x;head.append(n)}grid.append(head);

  const week=document.createElement('div');week.className='cal-week';grid.append(week);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(y,m,1-offset+w*7+i);return {key:localDay(d),inMonth:d.getMonth()===m}});
  days.forEach(({key,inMonth},i)=>{const n=document.createElement('button');n.className='cal-date'+(inMonth?'':' other-month')+(key===localDay(new Date())?' today':'');n.style.gridColumn=i+1;n.style.gridRow='1 / 6';n.dataset.date=key;n.textContent=Number(key.slice(-2));n.setAttribute('aria-label',dateFmt(key)+(inMonth?'':'，非本月'));n.style.backgroundColor=!inMonth?'#f5f5f5':'#fff';n.onclick=()=>{if(suppressCalendarClick){suppressCalendarClick=false;return}openCalendarEntry(key)};week.append(n)});
  const records=visibleEntries().map(e=>({e,cols:days.flatMap(({key},i)=>covers(e,key)?[i]:[])})).filter(x=>x.cols.length).sort((a,b)=>a.cols[0]-b.cols[0]||b.cols.length-a.cols.length);

  extra.forEach((ids,i)=>{if(!ids.length)return;const n=document.createElement('button');n.className='cal-more';n.style.gridColumn=i+1;n.textContent=`+${ids.length}`;n.setAttribute('aria-label',`查看当天另外 ${ids.length} 条记录`);n.title=[...new Set(ids.map(id=>state.entries.find(e=>e.id===id)?.title).filter(Boolean))].join('、');n.onclick=ev=>{ev.stopPropagation();previewDay(days[i].key)};week.append(n)});

$('#backup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({entries:state.entries,methods:state.methods},null,2)],{type:'application/json'}));a.download='career-fieldnotes.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('#restore').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=async ev=>{try{const d=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(d.entries)||!Array.isArray(d.methods)||!d.entries.every(e=>Number.isSafeInteger(e.id)&&typeof e.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.start_date))||!d.methods.every(m=>Number.isSafeInteger(m.id)&&typeof m.title==='string'))throw Error();if(confirm('导入将覆盖当前记录，继续吗？')){state.entries=normalize(d).entries.sort((a,b)=>b.start_date.localeCompare(a.start_date));state.methods=d.methods;saveStore();render();toast('已导入')}}catch{toast('备份格式错误')}ev.target.value=''};
function skillValues(){return $('#entryForm').elements.skills.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean)}
function syncSkills(){document.querySelectorAll('.skill-option').forEach(b=>b.classList.toggle('selected',skillValues().includes(b.dataset.skill)))}
document.querySelectorAll('.skill-option').forEach(b=>b.onclick=()=>{const a=skillValues(),t=b.dataset.skill;$('#entryForm').elements.skills.value=(a.includes(t)?a.filter(x=>x!==t):[...a,t]).join('，');syncSkills()});$('#entryForm').elements.skills.addEventListener('input',syncSkills);document.querySelector('#entryForm').addEventListener('reset',()=>queueMicrotask(syncSkills));
state={...state,...loadStore()};render();
</script></body></html>
